<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signing in to Account</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../design.css" />
    <!-- <link rel="stylesheet" href="../google_button.css" /> -->
    <link rel="stylesheet" href="onboarding.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a href="index.html" class="logo">
          <img src="../imgs/logo.svg" alt="CEO XB" />
        </a>
      </nav>
    </header>

    <main>
      <section class="signin-box">
        <h1>Welcome back</h1>

        <div class="signin-body">
          <form id="signin-form">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
            <!-- need a type=submit so the button can have validation checks w the email -->
            <button type="submit" id="continue" class="blue-round-button">
              Continue
            </button>
            <p id="signin-message" class="signin-message" role="status"></p>
          </form>

          <script>
            // listening to if form is submitted, checking if it is submitted, if so then it will do this
            document
              .getElementById("signin-form")
              .addEventListener("submit", (event) => {
                console.log("script loaded");
                // stopping page from reloading, that way the form will automatically
                // use its validation to check if the email is valid or empty or not
                // we are preventing the automatic reloading of page so we can add extra stuff before going to next page
                event.preventDefault();
                console.log(
                  "submitted",
                  document.getElementById("email").value
                );
                // getting email name
                const email = document.getElementById("email").value.trim();
                // setting the email variable to the sessionStorage temporary data storage
                sessionStorage.setItem("email", email);
                window.location.href = "password.html";
              });
          </script>

          <div class="text-divider">or</div>

          <!-- google button from google website -->
          <button class="gsi-material-button" style="width: 290px">
            <div class="gsi-material-button-state"></div>
            <div class="gsi-material-button-content-wrapper">
              <div class="gsi-material-button-icon">
                <svg
                  version="1.1"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 48 48"
                  xmlns:xlink="http://www.w3.org/1999/xlink"
                  style="display: block"
                >
                  <path
                    fill="#EA4335"
                    d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
                  ></path>
                  <path
                    fill="#4285F4"
                    d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
                  ></path>
                  <path
                    fill="#FBBC05"
                    d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
                  ></path>
                  <path
                    fill="#34A853"
                    d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
                  ></path>
                  <path fill="none" d="M0 0h48v48H0z"></path>
                </svg>
              </div>
              <span class="gsi-material-button-contents"
                >Continue with Google</span
              >
              <span style="display: none">Continue with Google</span>
            </div>
          </button>

          <span class="invite-label" id="invite-label"
            >Have an invitation?</span
          >
          <button
            type="button"
            class="pill pill-outline"
            id="signin-invitation"
            aria-describedby="invite-label"
          >
            Continue with Invitation Code
          </button>

          <p class="signin-apply-text">Don’t have an account?</p>
          <a href="request-access.html" class="signin-apply-link"
            >Apply to Join</a
          >
        </div>

        <a href="index.html" class="signin-back-link">
          <img src="../imgs/left_arrow.svg" id="left-arrow"alt="" />Back to Home</a
        >
      </section>
    </main>

    <footer>
      <p>CEO XB</p>
    </footer>

    <!-- scripts here -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="supabase.js"></script>
    <script src="script.js"></script>
    <script src="theme.js"></script>
  </body>
</html>
