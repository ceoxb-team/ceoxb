<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signing in to Account</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../design.css" />
    <!-- <link rel="stylesheet" href="../google_button.css" /> -->
    <link rel="stylesheet" href="onboarding.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a href="index.html" class="logo">
          <img src="../imgs/logo.svg" alt="CEO XB" />
        </a>
      </nav>
    </header>

    <main>
      <section class="get-started-box">
        <div class="get-started-image-group">
          <img
            src="../imgs/get-started-img.png"
            alt="an animated drawing of different people individually workingon technology and ideas"
            class="get-started-image"
          />
        </div>
        <h1>Let's get started.</h1>
        <p>
          To apply to CEO XB, please answer a few short questions<br />
          so we can learn more about you and your company.
        </p>
        <div class="button-group">
          <button class="blue-button">Complete a Short Questionare</button>
        </div>

        <a href="create-account.html" class="signin-back-link">
          <img src="../imgs/left_arrow.svg" id="left-arrow" alt="" />Back</a
        >
      </section>
    </main>

    <footer>
      <p>CEO XB</p>
    </footer>

    <!-- scripts here -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="supabase.js"></script>
    <script src="script.js"></script>
    <script src="theme.js"></script>
  </body>
</html>
