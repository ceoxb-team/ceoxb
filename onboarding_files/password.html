<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signing in to Account</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../design.css" />
    <link rel="stylesheet" href="onboarding.css" />
    <link rel="stylesheet" href="auth-fixes.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a href="../index.html" class="logo">
          <img src="../imgs/logo.svg" alt="CEO XB" />
        </a>
        <div class="nav-links">
          <a href="../index.html">Home</a>
        </div>
      </nav>
      
    </header>

    
    <main class="auth-page">
      <section class="auth-panel">
        <h1>Verify your account</h1>
    
        <p>
          Signing in as <strong id="email-display"></strong>
        </p>
    
        <p>
          Request a verification code by email,
          or sign in with your password.
        </p>
    
        <button type="button" id="send-code"
                class="auth-secondary">
          Send / Resend Email Code
        </button>
    
        <form id="verification-form">
          <label for="verification-code">
            Six-digit email code
          </label>
    
          <input
            id="verification-code"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            pattern="[0-9]{6}"
            maxlength="6"
            placeholder="000000"
            required
          >
    
          <button type="submit" id="verify-code"
                  class="auth-primary">
            Verify Code
          </button>
        </form>
    
        <div class="auth-divider">or</div>
    
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          autocomplete="current-password"
          placeholder="Enter your password"
        >
    
        <button type="button" id="password-signin"
                class="auth-primary">
          Sign In with Password
        </button>
    
        <p id="auth-message"
           role="status"
           aria-live="polite"></p>
    
        <a href="signin.html" class="auth-back">
          ← Back
        </a>
      </section>
    </main>


    <footer>
      <p>CEO XB</p>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="../supabase.js"></script>
    <script src="auth.js"></script>
    <script src="../theme.js"></script>
  </body>
</html>
