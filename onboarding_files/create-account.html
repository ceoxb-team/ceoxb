<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CEO XB - Apply to Join</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../design.css" />
    <link rel="stylesheet" href="onboarding.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a href="../index.html" class="logo">
          <img src="../imgs/logo.svg" alt="CEO XB" />
        </a>
        <div class="nav-links">
        <a href="../index.html">Home</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="signin-box">
        <h1>Tell Us About Yourself</h1>

        <div class="signin-body">
          <form id="creating-acc">
            <label for="first-name">First Name</label>
            <input
              type="text"
              id="first-name"
              name="first-name"
              autocomplete="given-name"
              required
            />

            <label for="last-name">Last Name</label>
            <input type="text" id="last-name" name="last-name" autocomplete="family-name" required />

            <label for="title">Title</label>
            <input type="text" id="title" name="title" required />

            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required />

            <label for="url">LinkedIn Profile URL</label>
            <input
              type="url"
              id="url"
              name="url"
              placeholder="https://www.linkedin.com/in/username"
              autocomplete="url"
            />

            <label for="phone-number">Phone Number</label>
            <input
              type="tel"
              id="phone-number"
              name="phone-number"
              autocomplete="tel"
              required
            />
            <div class="location-group">
              <div class="location">
                <label for="city">City</label>
                <input type="text" id="city" name="city" autocomplete="address-level2" required />
              </div>
              <div class="location">
                <label for="country">Country</label>
                <input type="text" id="country" name="country" autocomplete="country-name" required />
              </div>
            </div>

            <div class="round-button-group">
                <button type="submit" class="blue-round-button" id="continue">
                    Continue
                </button>
            </div>

           
            <p id="application-message" class="signin-message" role="status"></p>
          </form>
          
          <script>
            const form = document.getElementById("creating-acc");
            const continueButton = document.getElementById("continue");
            const status = document.getElementById("application-message");
          
            const fieldIds = [
              ["first-name", "firstName"],
              ["last-name", "lastName"],
              ["title", "title"],
              ["email", "email"],
              ["url", "url"],
              ["phone-number", "phoneNumber"],
              ["city", "city"],
              ["country", "country"]
            ];
          
            function updateContinue() {
              continueButton.disabled = !form.checkValidity();
            }
          
            form.addEventListener("input", updateContinue);
            updateContinue();
          
            form.addEventListener("submit", function(event) {
              event.preventDefault();
          
              if (!form.reportValidity()) return;
          
              const values = {};
          
              for (const [id, key] of fieldIds) {
                const value = document.getElementById(id).value.trim();
          
                if (id !== "url" && !value) {
                  status.textContent = "Please complete all required fields.";
                  return;
                }
          
                values[key] = value;
              }
          
              for (const [key, value] of Object.entries(values)) {
                sessionStorage.setItem(key, value);
              }
          
              window.location.href = "get-started.html";
            });
          </script>
        </div>
        
      <a href="signin.html" class="signin-back-button">
        ← Back
      </a>
      </section>
    </main>

    <footer>
      <p>CEO XB</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="../supabase.js"></script>
    <script src="../theme.js"></script>
  </body>
</html>
