<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CEO XB - Set Your Password</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../design.css" />
    <link rel="stylesheet" href="onboarding.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a href="../index.html" class="logo">
          <img src="../imgs/logo.svg" alt="CEO XB" />
        </a>
        <div class="nav-links">
          <a href="../index.html">Home</a>
        </div>
      </nav>
    </header>

    <main class="auth-page">
      <section class="auth-panel">
        <h1>Welcome to CEO XB</h1>

        <p id="set-password-intro">
          Your application was approved. Choose a password to finish
          setting up your account.
        </p>

        <form id="set-password-form" hidden>
          <label for="new-password">New password</label>
          <input
            type="password"
            id="new-password"
            autocomplete="new-password"
            minlength="8"
            placeholder="At least 8 characters"
            required
          >

          <label for="confirm-password">Confirm password</label>
          <input
            type="password"
            id="confirm-password"
            autocomplete="new-password"
            minlength="8"
            placeholder="Type it again"
            required
          >

          <button type="submit" id="save-password" class="auth-primary">
            Save Password
          </button>
        </form>

        <p id="auth-message" role="status" aria-live="polite"></p>

        <a href="signin.html" class="auth-back-button" id="set-password-signin" hidden>
          Go to Sign In
        </a>
      </section>
    </main>

    <footer>
      <p>CEO XB</p>
    </footer>

    <!-- Read the invite link details before Supabase clears them from the URL -->
    <script>window.inviteLinkHash = window.location.hash;</script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="../supabase.js"></script>
    <script src="set-password.js"></script>
    <script src="../theme.js"></script>
  </body>
</html>
