<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CEO XB - Get Started</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../design.css" />
    <link rel="stylesheet" href="onboarding.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a href="../index.html" class="logo">
          <img src="../imgs/logo.svg" alt="CEO XB" />
        </a>
        <div class="nav-links">
          <a href="../index.html">Home</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="get-started-box">
        <h1>We’re excited you’re here.</h1>
        <p id="success-paragraph">
          Thank you for sharing more about yourself and your company. Our team
          will review your application. If your profile aligns with CEO XB’s
          membership criteria, we’ll reach out to schedule a short interview as
          the final step before acceptance.
        </p>
        <div class="get-started-image-group">
          <img
            src="../imgs/success.png"
            alt="an animated drawing of different people individually workingon technology and ideas"
            class="get-started-image"
          />
        </div>

        <div class="button-group">
          <a class="blue-button" href="application.html">Next</a>
        </div>
      </section>
    </main>

    <footer>
      <p>CEO XB</p>
    </footer>

    <!-- scripts here -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="../supabase.js"></script>
    <script src="../script.js"></script>
    <script src="../theme.js"></script>
  </body>
</html>
