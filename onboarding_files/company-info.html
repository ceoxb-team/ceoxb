<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signing in to Account</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../design.css" />
    <link rel="stylesheet" href="onboarding.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a href="../index.html" class="logo">
          <img src="../imgs/logo.svg" alt="CEO XB" />
        </a>
        <div class="nav-links">
        <a href="../index.html">Home</a>
      </div>
      </nav>
    </header>

    <main>
      <section class="signin-box">
        <h1>Please share a little about your company with us.</h1>

        <div class="signin-body">
          <form id="company-info">
            
            <label for="company-name">What is your company’s name?</label>
            <input
              type="text"
              id="company-name"
              name="company-name"
              required
            />

            <label for="website">What is your company’s website?</label>
            <input
              type="url"
              id="website"
              name="website"
              placeholder="https://company.com"
              required
            />

            <label for="company-country"
              >What country is your company located in?</label
            >
            <input
              type="text"
              id="company-country"
              name="company-country"
              required
            />
            <fieldset class="industry-fieldset">
              <legend>What is your company's industry?</legend>
            <input
              type="radio"
              id="biopharma"
              name="company-industry"
              value="Biopharma"
              required
            />
            <label for="biopharma">Biopharma</label><br />

            <input
              type="radio"
              id="health-tech"
              name="company-industry"
              value="Health Tech"
              required
            />
            <label for="health-tech">Health Tech</label><br />

            <input
              type="radio"
              id="medical-devices"
              name="company-industry"
              value="Medical Devices"
              required
            />
            <label for="medical-devices">Medical Devices</label><br />

            <input
              type="radio"
              id="digital-health"
              name="company-industry"
              value="Digital Health"
              required
            />
            <label for="digital-health">Digital Health</label><br />

            <input
              type="radio"
              id="diagnostics"
              name="company-industry"
              value="Diagnostics"
              required
            />
            <label for="diagnostics">Diagnostics</label><br />

            <input type="radio" id="other" name="company-industry" value="Other" required />
            <label for="other">Other</label><br />
            </fieldset>

            <!-- need a type=submit so the button can have validation checks w the email -->
            <button type="submit" id="continue" class="blue-round-button">
              Continue
            </button>
            <p id="signin-message" class="signin-message" role="status"></p>
          </form>

          <script>
              const companyForm = document.getElementById("company-info");
            
              companyForm.addEventListener("submit", function(event) {
                event.preventDefault();
            
                const companyName = document.getElementById("company-name").value.trim();
                const website = document.getElementById("website").value.trim();
                const country = document.getElementById("company-country").value.trim();
                const industry = companyForm.querySelector(
                  'input[name="company-industry"]:checked'
                );
            
                if (!companyName || !website || !country || !industry) {
                  return;
                }
            
                sessionStorage.setItem("companyName", companyName);
                sessionStorage.setItem("companyWebsite", website);
                sessionStorage.setItem("companyCountry", country);
                sessionStorage.setItem("industry", industry.value);
            
                window.location.href = "application-review.html";
              });
          </script>
        </div>
        <a href="get-started.html" class="signin-back-link">
        <img src="../imgs/left_arrow.svg" id="left-arrow" alt="" />
        Back</a>
      </section>
    </main>

    <footer>
      <p>CEO XB</p>
    </footer>

    <!-- scripts here -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="../supabase.js"></script>
    <script src="../script.js"></script>
    <script src="../theme.js"></script>
  </body>
</html>
