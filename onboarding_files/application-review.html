<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CEO XB - Review Application</title>

    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../design.css" />
    <link rel="stylesheet" href="onboarding.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a href="../index.html" class="logo">
          <img src="../imgs/logo.svg" alt="CEO XB" />
        </a>

        <div class="nav-links">
          <a href="../index.html">Home</a>
        </div>
      </nav>
    </header>

    <main class="signin-page">
      <section class="signin-box">
        <h1>Review your application</h1>
        <p>Make sure your information is correct before submitting.</p>

        <div id="application-summary"></div>

        <!-- Hidden from people; bots that fill it in are ignored -->
        <div class="application-honeypot" aria-hidden="true">
          <label for="company-fax">Company fax</label>
          <input type="text" id="company-fax" name="company_fax" tabindex="-1" autocomplete="off" />
        </div>

        <div class="cf-turnstile application-captcha" data-sitekey="0x4AAAAAAF5Wo4S_J_-xTFY2"></div>

        <button type="button" id="submit-application" class="blue-round-button">
          Submit Application
        </button>

        <p id="application-status" role="status" aria-live="polite"></p>

        <a href="employees.html" class="signin-back-link"> Back </a>
      </section>
    </main>

    <footer>
      <p>CEO XB</p>
    </footer>

    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="../supabase.js"></script>
    <script src="application-review.js"></script>
    <script src="../theme.js"></script>
  </body>
</html>
