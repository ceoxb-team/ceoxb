<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CEO XB - Sign In</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="header.css" />
    <link rel="stylesheet" href="design.css" />
    <link rel="stylesheet" href="google_button.css" />
  </head>
  <body
    style="background-color: white !important; background: white !important"
  >
    <header>
      <nav class="navbar">
        <a href="index.html" class="logo">
          <img src="imgs/logo.svg" alt="CEO XB" />
        </a>
        <!-- <div class="nav-links"> -->
        <!-- <a href="index.html">Home</a> -->
        <!-- <a href="index.html#about">About</a> -->
        <!-- <a href="request-access.html" class="signup-btn">Request Access</a> -->
        <!-- </div> -->
      </nav>
    </header>

    <main class="signin-page">
      <section class="signin-box">
        <h1>Welcome back</h1>

        <div class="signin-body">
          <form id="signin-form" novalidate>
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              required
            />
            <button type="submit" class="pill pill-primary">Continue</button>
            <p id="signin-message" class="signin-message" role="status"></p>
          </form>

          <div class="text-divider">or</div>

          <button class="gsi-material-button" style="width: 290px">
            <div class="gsi-material-button-state"></div>
            <div class="gsi-material-button-content-wrapper">
              <div class="gsi-material-button-icon">
                <svg
                  version="1.1"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 48 48"
                  xmlns:xlink="http://www.w3.org/1999/xlink"
                  style="display: block"
                >
                  <path
                    fill="#EA4335"
                    d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
                  ></path>
                  <path
                    fill="#4285F4"
                    d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
                  ></path>
                  <path
                    fill="#FBBC05"
                    d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
                  ></path>
                  <path
                    fill="#34A853"
                    d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
                  ></path>
                  <path fill="none" d="M0 0h48v48H0z"></path>
                </svg>
              </div>
              <span class="gsi-material-button-contents"
                >Continue with Google</span
              >
              <span style="display: none">Continue with Google</span>
            </div>
          </button>

          <span class="invite-label" id="invite-label"
            >Have an invitation?</span
          >
          <button
            type="button"
            class="pill pill-outline"
            id="signin-invitation"
            aria-describedby="invite-label"
          >
            Continue with Invitation Code
          </button>
          <!-- font-family: "Roboto", arial, sans-serif; -->

          <p class="signin-apply-text">Don’t have an account?</p>
          <a href="request-access.html" class="signin-apply-link"
            >Apply to Join</a
          >
        </div>

        <a href="index.html" class="signin-back-link">
          <span aria-hidden="true">←</span>Back to Home</a>
      </section>
    </main>

    <footer>
      <p>CEO XB</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="supabase.js"></script>
    <script src="script.js"></script>
    <script src="theme.js"></script>
    <script>
      document.getElementById("signin-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const email = document.getElementById("email");
        const msg = document.getElementById("signin-message");
        if (!email.checkValidity()) {
          msg.textContent = "Enter a valid email address.";
          email.focus();
          return;
        }
        msg.textContent = "";
        // TODO: send email to your auth endpoint
      });
    </script>
  </body>
</html>
