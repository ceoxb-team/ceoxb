<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEO XB - Connect</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="design.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="dashboard.html" class="logo">
                <img src="imgs/logo.svg" alt="CEO XB">
            </a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="cohorts.html">Cohorts</a>
            <a href="calendar.html">Schedule</a>
            <a href="connect.html" aria-current="page">Community</a>
        
            <details class="account-menu">
                <summary>Account</summary>
                <div class="account-menu-panel">
                    <a href="profile.html">My Profile</a>
                    <a href="#" id="signout">Sign Out</a>
                </div>
            </details>
        </div>
        </nav>
    </header>

    <main class="dashboard">
        <section class="dashboard-header">
            <h1>Member Directory</h1>
            <p>Find and connect with fellow CEOs in the CEO XB community.</p>
        </section>
        <nav class="section-subnav" aria-label="Community sections">
            <a href="connect.html" aria-current="page">Members</a>
            <a href="discuss.html">Discussions</a>
            <a href="learn.html">Learn</a>
        </nav>
        <section class="connect-search member-search-panel">
            <label for="member-search">Find a Member</label>
            <p>Enter a name, company, or location to find someone.</p>
            <input type="search"
                   id="member-search"
                   placeholder="Name, company, or location"
                   autocomplete="off">
        </section>

        <section class="dashboard-section">
            <div class="section-heading">
                <h2>Member Directory</h2>
                <span id="member-count">0 members</span>
            </div>
        
            <div class="dashboard-grid" id="member-list"></div>
            <p id="no-search-results" class="learn-note" hidden>
                No matching members found.
            </p>
        </section>
    </main>

    <footer><p>CEO XB</p></footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="supabase.js"></script>
    <script src="script.js"></script>
    <script src="theme.js"></script>
    
</body>
</html>
